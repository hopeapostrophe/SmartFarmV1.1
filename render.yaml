services:
  - type: web
    name: smartfarmai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip uninstall -y opencv-python && pip install --no-cache-dir opencv-python-headless
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EARTHDATA_USER
        sync: false   # set in the Render dashboard, never in git
      - key: EARTHDATA_PASS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
